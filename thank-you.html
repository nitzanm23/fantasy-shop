<!doctype html>
<html lang="en">
  <!--
    Fantasy Shop: thank-you page (portfolio demo).
    Sections: Header, Hero, Confirmation, Footer.
    Header and footer markup is rendered by scripts/nav.js and scripts/footer.js.
  -->

  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Thank you for contacting Fantasy Shop. Your message was received and our team will get back to you shortly."
    />
    <meta name="theme-color" content="#ada996" />

    <title>Thank You | Fantasy Shop</title>

    <link rel="icon" href="./assets/icons/favicon.ico" type="image/x-icon" />
    <link
      rel="canonical"
      href="https://nitzanm23.github.io/fantasy-shop/thank-you.html"
    />

    <!-- Social sharing preview (LinkedIn, Slack, WhatsApp, X); these require absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fantasy Shop" />
    <meta property="og:title" content="Thank You | Fantasy Shop" />
    <meta
      property="og:description"
      content="Thank you for contacting Fantasy Shop. Your message was received and our team will get back to you shortly."
    />
    <meta
      property="og:url"
      content="https://nitzanm23.github.io/fantasy-shop/thank-you.html"
    />
    <meta
      property="og:image"
      content="https://nitzanm23.github.io/fantasy-shop/assets/images/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Fantasy Shop home page with product carousels"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-hosted font (vendor/) -->
    <link
      rel="preload"
      href="./vendor/fonts/fredoka-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./vendor/fonts/fonts.css" />

    <!-- Project styles -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./styles/nav.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
    <link rel="stylesheet" href="./styles/thank-you.css" />

    <!-- Project scripts -->
    <script src="./scripts/nav.js" defer></script>
    <script src="./scripts/footer.js" defer></script>
    <script src="./scripts/demo-notice.js" defer></script>
    <script src="./scripts/background-video.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- ========== HEADER ========== -->
    <header class="site-header">
      <nav class="navbar u-radius-bottom" aria-label="Primary navigation"></nav>
    </header>

    <!-- ========== MAIN CONTENT ========== -->

    <main class="page-main" id="main-content">
      <!-- ========== HERO ========== -->
      <section class="thank-you-hero" aria-label="Thank you page hero">
        <video
          class="thank-you-hero__video"
          poster="./assets/videos/thank-you-poster.webp"
          loop
          muted
          playsinline
          preload="metadata"
          data-background-video
          aria-hidden="true"
        >
          <source src="./assets/videos/thank-you.mp4" type="video/mp4" />
        </video>
      </section>
      <!-- ========== CONFIRMATION ========== -->
      <section class="thank-you" aria-labelledby="thank-you-title">
        <div class="container">
          <article class="thank-you__card">
            <div class="thank-you__grid">
              <img
                src="./assets/images/thank-you/thank-you.webp"
                alt="Thank you illustration"
                draggable="false"
                class="thank-you__image u-shadow-black"
                loading="lazy"
              />

              <div class="thank-you__content">
                <h1 class="thank-you__title" id="thank-you-title">
                  Thanks for filling out that form!
                </h1>

                <p class="thank-you__text thank-you__text--featured">
                  <span>You are Awesome.</span>
                </p>

                <p class="thank-you__text">
                  You will <span>hear from us shortly</span>. In the meantime,
                  <span>continue your shopping journey.</span>
                </p>

                <a href="./index.html" class="button thank-you__action"
                  >Go Home</a
                >
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer u-radius-bottom"></footer>
  </body>
</html>
